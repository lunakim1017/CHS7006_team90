<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* ---------- tokens (from DESIGN_apple.md) ---------- */
  :root{
    --color-primary:#0066cc;
    --color-primary-focus:#0071e3;
    --color-primary-on-dark:#2997ff;
    --color-ink:#1d1d1f;
    --color-on-dark:#ffffff;
    --color-body-muted:#cccccc;
    --color-ink-muted-80:#333333;
    --color-ink-muted-48:#7a7a7a;
    --color-hairline:#e0e0e0;
    --color-canvas:#ffffff;
    --color-parchment:#f5f5f7;
    --color-pearl:#fafafc;
    --color-tile-1:#272729;
    --color-tile-2:#2a2a2c;
    --color-tile-3:#252527;
    --color-black:#000000;
    --color-chip-translucent:rgba(210,210,215,.64);
    --color-on-primary:#ffffff;

    --radius-none:0px; --radius-xs:5px; --radius-sm:8px; --radius-md:11px; --radius-lg:18px; --radius-pill:9999px;
    --space-xxs:4px; --space-xs:8px; --space-sm:12px; --space-md:17px; --space-lg:24px; --space-xl:32px; --space-xxl:48px; --space-section:80px;
    --shadow-product:3px 5px 30px rgba(0,0,0,.22);

    --font-display:'SF Pro Display',-apple-system,BlinkMacSystemFont,'Inter','Noto Sans KR','Noto Sans SC',system-ui,sans-serif;
    --font-text:'SF Pro Text',-apple-system,BlinkMacSystemFont,'Inter','Noto Sans KR','Noto Sans SC',system-ui,sans-serif;

    /* semantic surface roles -> light values */
    --bg-page:var(--color-parchment);
    --bg-canvas:var(--color-canvas);
    --bg-tile:var(--color-parchment);
    --bg-chip:var(--color-canvas);
    --bg-pearl:var(--color-pearl);
    --text-primary:var(--color-ink);
    --text-secondary:var(--color-ink-muted-80);
    --text-tertiary:var(--color-ink-muted-48);
    --border-hairline:var(--color-hairline);
    --accent:var(--color-primary);
    --accent-focus:var(--color-primary-focus);
    --pip-filled:var(--color-ink);
    --pip-empty:var(--color-hairline);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg-page:var(--color-tile-3);
      --bg-canvas:var(--color-tile-1);
      --bg-tile:var(--color-tile-2);
      --bg-chip:var(--color-tile-2);
      --bg-pearl:var(--color-tile-2);
      --text-primary:#ffffff;
      --text-secondary:var(--color-body-muted);
      --text-tertiary:rgba(255,255,255,.55);
      --border-hairline:rgba(255,255,255,.14);
      --accent:var(--color-primary-on-dark);
      --accent-focus:var(--color-primary-on-dark);
      --pip-filled:#ffffff;
      --pip-empty:rgba(255,255,255,.25);
    }
  }
  :root[data-theme="dark"]{
    --bg-page:var(--color-tile-3);
    --bg-canvas:var(--color-tile-1);
    --bg-tile:var(--color-tile-2);
    --bg-chip:var(--color-tile-2);
    --bg-pearl:var(--color-tile-2);
    --text-primary:#ffffff;
    --text-secondary:var(--color-body-muted);
    --text-tertiary:rgba(255,255,255,.55);
    --border-hairline:rgba(255,255,255,.14);
    --accent:var(--color-primary-on-dark);
    --accent-focus:var(--color-primary-on-dark);
    --pip-filled:#ffffff;
    --pip-empty:rgba(255,255,255,.25);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-page);
    color:var(--text-primary);
    font-family:var(--font-text);
    font-size:17px;
    line-height:1.47;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  img,svg{max-width:100%;display:block;}
  button{font-family:inherit;cursor:pointer;}
  input{font-family:inherit;}
  a{color:var(--accent);}
  :focus-visible{outline:2px solid var(--accent-focus);outline-offset:2px;}
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
  }

  h1,h2,h3,p{margin:0;text-wrap:balance;}

  /* Apple-tight negative tracking reserved for Latin (English) UI; CJK stays neutral to avoid glyph crowding */
  body.lang-en .tracked-hero{letter-spacing:-.28px;}
  body.lang-en .tracked-display{letter-spacing:0;}
  body.lang-en .tracked-tagline{letter-spacing:.231px;}
  body.lang-en .tracked-body{letter-spacing:-.374px;}
  body:not(.lang-en) .tracked-hero,
  body:not(.lang-en) .tracked-display,
  body:not(.lang-en) .tracked-tagline,
  body:not(.lang-en) .tracked-body{letter-spacing:0;}

  /* ---------- typography scale ---------- */
  .hero-display{font-family:var(--font-display);font-size:56px;font-weight:600;line-height:1.07;}
  .display-lg{font-family:var(--font-display);font-size:40px;font-weight:600;line-height:1.1;}
  .lead{font-family:var(--font-display);font-size:28px;font-weight:400;line-height:1.14;}
  .tagline{font-family:var(--font-display);font-size:21px;font-weight:600;line-height:1.19;}
  .body-strong{font-family:var(--font-text);font-size:17px;font-weight:600;line-height:1.24;}
  .body-txt{font-family:var(--font-text);font-size:17px;font-weight:400;line-height:1.47;}
  .caption{font-family:var(--font-text);font-size:14px;font-weight:400;line-height:1.43;}
  .caption-strong{font-family:var(--font-text);font-size:14px;font-weight:600;line-height:1.29;}
  .fine-print{font-family:var(--font-text);font-size:12px;font-weight:400;line-height:1.4;}
  .nav-link{font-family:var(--font-text);font-size:12px;font-weight:400;line-height:1;}

  @media (max-width:640px){
    .hero-display{font-size:34px;}
    .display-lg{font-size:28px;}
    .lead{font-size:19px;}
  }

  /* ---------- global nav ---------- */
  .gnav{
    position:sticky;top:0;z-index:50;
    background:var(--color-black);
    color:var(--color-on-dark);
    height:44px;
    display:flex;align-items:center;justify-content:space-between;
    padding:0 20px;
  }
  .gnav-brand{font-family:var(--font-text);font-size:14px;font-weight:600;letter-spacing:-.1px;color:#fff;display:flex;align-items:center;gap:6px;}
  .lang-switch{display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:var(--radius-pill);padding:2px;}
  .lang-btn{
    border:none;background:transparent;color:rgba(255,255,255,.65);
    font-family:var(--font-text);font-size:12px;font-weight:500;
    padding:5px 12px;border-radius:var(--radius-pill);
  }
  .lang-btn[aria-pressed="true"]{background:var(--color-primary);color:#fff;}

  /* ---------- hero ---------- */
  .hero{
    background:var(--bg-tile);
    padding:56px 20px 40px;
    text-align:center;
  }
  .hero-inner{max-width:720px;margin:0 auto;}
  .hero .lead{color:var(--text-secondary);margin-top:12px;}
  .search-wrap{margin-top:32px;display:flex;justify-content:center;}
  .search-input{
    width:100%;max-width:520px;height:44px;
    background:var(--bg-canvas);color:var(--text-primary);
    border:1px solid var(--border-hairline);border-radius:var(--radius-pill);
    padding:0 20px;font-size:17px;
  }
  .search-input::placeholder{color:var(--text-tertiary);}
  .tabs{display:flex;justify-content:center;gap:10px;margin-top:24px;}
  .tab-btn{
    border-radius:var(--radius-pill);padding:9px 20px;font-size:14px;font-weight:500;
    border:1px solid var(--accent);background:transparent;color:var(--accent);
  }
  .tab-btn[aria-selected="true"]{background:var(--accent);color:#fff;}

  /* ---------- filters ---------- */
  .filters{max-width:1100px;margin:0 auto;padding:28px 20px 0;}
  .filters-label{color:var(--text-tertiary);margin-bottom:10px;}
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .filter-chip{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--bg-chip);color:var(--text-primary);
    border:1px solid var(--border-hairline);border-radius:var(--radius-pill);
    padding:8px 14px;font-size:14px;
  }
  .filter-chip[aria-pressed="true"]{border:2px solid var(--accent-focus);color:var(--accent);padding:7px 13px;}

  /* ---------- results meta ---------- */
  .results-meta{max-width:1100px;margin:20px auto 0;padding:0 20px;color:var(--text-tertiary);}

  /* ---------- grid ---------- */
  .grid{
    max-width:1100px;margin:0 auto;padding:16px 20px 80px;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;
  }
  .card{
    background:var(--bg-canvas);border:1px solid var(--border-hairline);
    border-radius:var(--radius-lg);padding:24px;
    display:flex;flex-direction:column;gap:14px;position:relative;
  }
  .card-top{display:flex;gap:14px;align-items:flex-start;}
  .tile-emoji{
    flex:none;width:60px;height:60px;border-radius:var(--radius-sm);
    background:var(--bg-tile);display:flex;align-items:center;justify-content:center;
    font-size:30px;box-shadow:var(--shadow-product);
  }
  .card-name{flex:1;min-width:0;}
  .card-name .native{color:var(--text-tertiary);margin-top:2px;}
  .save-btn{
    position:absolute;top:16px;right:16px;
    background:transparent;border:none;font-size:20px;line-height:1;
    color:var(--text-tertiary);padding:4px;
  }
  .save-btn[aria-pressed="true"]{color:var(--accent);}

  .spice-row{display:flex;align-items:center;gap:8px;}
  .pips{display:inline-flex;gap:3px;}
  .pip{width:8px;height:8px;border-radius:50%;background:var(--pip-empty);}
  .pip.filled{background:var(--pip-filled);}
  .spice-text{color:var(--text-tertiary);}

  .field-label{color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.06em;font-size:11px;font-weight:600;margin-bottom:3px;}
  .field-value{color:var(--text-secondary);}

  .badge-row{display:flex;flex-wrap:wrap;gap:6px;}
  .badge{
    display:inline-flex;align-items:center;gap:4px;
    background:var(--bg-pearl);border:1px solid var(--border-hairline);
    border-radius:var(--radius-md);padding:4px 10px;color:var(--text-secondary);
  }

  .tip-box{
    background:var(--bg-pearl);border-radius:var(--radius-sm);
    padding:10px 12px;color:var(--text-tertiary);
  }

  .empty-state{
    max-width:520px;margin:40px auto 100px;text-align:center;
    color:var(--text-tertiary);padding:0 20px;
  }
  .empty-state .glyph{font-size:40px;margin-bottom:12px;}

  /* ---------- footer ---------- */
  .site-footer{
    background:var(--bg-tile);color:var(--text-tertiary);
    padding:40px 20px;text-align:center;
  }

  @media (max-width:480px){
    .hero{padding:40px 16px 32px;}
  }

  /* ---------- card interaction ---------- */
  .card{cursor:pointer;transition:border-color .15s;}
  .card:hover,.card:focus-visible{border-color:var(--accent);}
  button:active,.card:active,.btn-find:active{transform:scale(.96);}

  .badge.badge-adventurous{border-color:var(--accent);color:var(--accent);}

  /* ---------- detail modal ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,.5);
    display:flex;align-items:center;justify-content:center;
    padding:20px;z-index:200;
  }
  .modal-panel{
    background:var(--bg-canvas);border-radius:var(--radius-lg);
    max-width:560px;width:100%;max-height:85vh;overflow-y:auto;
    padding:32px;position:relative;display:flex;flex-direction:column;gap:16px;
  }
  .modal-close{
    position:absolute;top:16px;right:16px;
    background:var(--bg-pearl);border:1px solid var(--border-hairline);
    border-radius:50%;width:32px;height:32px;font-size:16px;
    color:var(--text-secondary);line-height:1;
  }
  .modal-tile{width:76px;height:76px;font-size:38px;}
  .modal-about{color:var(--text-secondary);}
  .pairing-box{color:var(--text-secondary);}
  .btn-find{
    display:flex;align-items:center;justify-content:center;gap:8px;
    background:var(--accent);color:#fff;text-decoration:none;
    border-radius:var(--radius-pill);padding:14px 22px;
    font-size:16px;font-weight:500;margin-top:4px;
  }
</style>

          '<div>' +
            '<div class="field-label">' + t("taste") + '</div>' +
            '<div class="caption field-value">' + escapeHtml(item.taste[state.lang]) + '</div>' +
          '</div>' +
          '<div class="caption pairing-box">🥂 ' + escapeHtml(item.pairing[state.lang]) + '</div>' +
          '<div class="tip-box fine-print">💡 ' + t("tip") + ': ' + escapeHtml(item.tip[state.lang]) + '</div>' +
          '<button class="save-btn" data-action="toggle-save" data-id="' + item.id + '" aria-pressed="' + isSaved + '" style="position:static;align-self:flex-start;font-size:24px;" aria-label="' + (isSaved ? t("unsave") : t("save")) + '">' + (isSaved ? "♥" : "♡") + '</button>' +
          '<a class="btn-find" data-action="find-near-me" data-id="' + item.id + '" href="' + escapeHtml(mapUrl(item)) + '" target="_blank" rel="noopener noreferrer">📍 ' + findLabel + '</a>' +
        '</div>' +
      '</div>'
    );
  }

  function filterChip(key, label){
    var active = state.filters.has(key);
    return '<button class="filter-chip" data-action="toggle-filter" data-key="' + key + '" aria-pressed="' + active + '">' + label + '</button>';
  }

  function render(){
    document.documentElement.lang = state.lang;
    document.body.className = "lang-" + state.lang;

    var list = DATA.filter(function(item){
      return matchesQuery(item) && matchesFilters(item);
    });

    var savedList = DATA.filter(function(item){ return state.saved.has(item.id); });
    var activeList = state.tab === "saved" ? savedList : list;

    var app = document.getElementById("app");

    var langBtns = ["ko","en","zh"].map(function(l){
      var lbl = l === "ko" ? "한국어" : (l === "en" ? "EN" : "中文");
      return '<button class="lang-btn" data-action="set-lang" data-lang="' + l + '" aria-pressed="' + (state.lang===l) + '">' + lbl + '</button>';
    }).join("");

    var filterChips = state.tab === "search" ? (
      '<section class="filters">' +
        '<div class="caption filters-label">' + t("filtersLabel") + '</div>' +
        '<div class="chip-row">' +
          filterChip("vegan", t("fVegan")) +
          filterChip("vegetarian", t("fVeg")) +
          filterChip("halal", t("fHalal")) +
          filterChip("noPork", t("fNoPork")) +
          filterChip("noSeafood", t("fNoSeafood")) +
          filterChip("mild", t("fMild")) +
          filterChip("adventurous", "🌟 " + t("fAdventurous")) +
        '</div>' +
      '</section>'
    ) : "";

    var searchBar = state.tab === "search" ? (
      '<div class="search-wrap">' +
        '<input class="search-input tracked-body" type="text" id="search-input" placeholder="' + t("searchPh") + '" value="' + escapeHtml(state.query) + '" aria-label="' + t("searchPh") + '">' +
      '</div>'
    ) : "";

    var resultsMeta = state.tab === "search"
      ? '<div class="caption results-meta">' + activeList.length + t("results") + '</div>'
      : "";

    var gridOrEmpty;
    if(activeList.length === 0){
      if(state.tab === "saved"){
        gridOrEmpty = '<div class="empty-state"><div class="glyph">🤍</div><div class="body-strong">' + t("savedEmptyTitle") + '</div><div class="caption" style="margin-top:6px;">' + t("savedEmptyBody") + '</div></div>';
      } else {
        gridOrEmpty = '<div class="empty-state"><div class="glyph">🔍</div><div class="caption">' + t("noResults") + '</div></div>';
      }
    } else {
      gridOrEmpty = '<div class="grid">' + activeList.map(cardHtml).join("") + '</div>';
    }

    var detailItem = state.detailId ? findById(state.detailId) : null;
    var modal = detailItem ? detailHtml(detailItem) : "";

    app.innerHTML =
      '<header class="gnav">' +
        '<div class="gnav-brand">🥢 ' + t("siteTitle") + '</div>' +
        '<div class="lang-switch">' + langBtns + '</div>' +
      '</header>' +
      '<section class="hero">' +
        '<div class="hero-inner">' +
          '<h1 class="hero-display tracked-hero">' + t("heroHead") + '</h1>' +
          '<p class="lead tracked-display">' + t("heroLead") + '</p>' +
          searchBar +
          '<div class="tabs" role="tablist">' +
            '<button class="tab-btn" role="tab" data-action="set-tab" data-tab="search" aria-selected="' + (state.tab==="search") + '">' + t("tabSearch") + '</button>' +
            '<button class="tab-btn" role="tab" data-action="set-tab" data-tab="saved" aria-selected="' + (state.tab==="saved") + '">' + t("tabSaved") + ' (' + state.saved.size + ')</button>' +
          '</div>' +
        '</div>' +
      '</section>' +
      filterChips +
      resultsMeta +
      gridOrEmpty +
      '<footer class="site-footer fine-print">' + t("footer") + '</footer>' +
      modal;

    if(detailItem){
      var closeBtn = document.querySelector(".modal-close");
      if(closeBtn) closeBtn.focus();
    } else {
      var input = document.getElementById("search-input");
      if(input){
        input.focus();
        var v = input.value;
        input.value = "";
        input.value = v;
      }
    }
  }

  document.addEventListener("click", function(e){
    var btn = e.target.closest("[data-action]");
    if(!btn) return;
    var action = btn.getAttribute("data-action");
    if(action === "set-lang"){
      state.lang = btn.getAttribute("data-lang");
      persist();
      render();
    } else if(action === "set-tab"){
      state.tab = btn.getAttribute("data-tab");
      render();
    } else if(action === "toggle-filter"){
      var key = btn.getAttribute("data-key");
      if(state.filters.has(key)) state.filters.delete(key); else state.filters.add(key);
      render();
    } else if(action === "toggle-save"){
      var id = btn.getAttribute("data-id");
      var nowSaved;
      if(state.saved.has(id)){ state.saved.delete(id); nowSaved = false; } else { state.saved.add(id); nowSaved = true; }
      persist();
      logEvent(nowSaved ? "save" : "unsave", findById(id), {wasSaved: nowSaved});
      render();
      e.stopPropagation();
    } else if(action === "open-detail"){
      state.detailId = btn.getAttribute("data-id");
      render();
    } else if(action === "close-detail"){
      if(btn.classList.contains("modal-backdrop") && e.target !== btn) return;
      state.detailId = null;
      render();
    } else if(action === "find-near-me"){
      var fid = btn.getAttribute("data-id");
      logEvent("find_near_me", findById(fid), {wasSaved: state.saved.has(fid)});
    }
  });

  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && state.detailId){
      state.detailId = null;
      render();
      return;
    }
    if((e.key === "Enter" || e.key === " ") && e.target.matches('[data-action="open-detail"]')){
      e.preventDefault();
      state.detailId = e.target.getAttribute("data-id");
      render();
    }
  });

  var searchLogTimer = null;
  var lastLoggedQuery = "";

  document.addEventListener("input", function(e){
    if(e.target && e.target.id === "search-input"){
      state.query = e.target.value;
      var list = DATA.filter(function(item){ return matchesQuery(item) && matchesFilters(item); });
      document.querySelector(".results-meta") && (document.querySelector(".results-meta").textContent = list.length + t("results"));
      var grid = document.querySelector(".grid");
      var emptyState = document.querySelector(".empty-state");
      if(list.length === 0){
        var html = '<div class="empty-state"><div class="glyph">🔍</div><div class="caption">' + t("noResults") + '</div></div>';
        if(grid){ grid.outerHTML = html; } else if(emptyState){ emptyState.outerHTML = html; }
      } else {
        var html = '<div class="grid">' + list.map(cardHtml).join("") + '</div>';
        if(grid){ grid.outerHTML = html; } else if(emptyState){ emptyState.outerHTML = html; }
      }

      clearTimeout(searchLogTimer);
      searchLogTimer = setTimeout(function(){
        var q = state.query.trim();
        if(!q || q === lastLoggedQuery) return;
        lastLoggedQuery = q;
        list.forEach(function(item){
          logEvent("search", item, {query: q});
        });
      }, 700);
    }
  });

  render();
})();
</script>
